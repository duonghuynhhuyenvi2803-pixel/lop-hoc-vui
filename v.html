<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b3fb5">
<title>Writing Room</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/viet.css">
<script src="vendor/mqtt.min.js"></script>
</head>
<body class="student">
<section id="sJoin" class="sjoin">
  <h1>✍️ Writing Room</h1>
  <label>PIN code<input id="pin" inputmode="numeric" maxlength="7" placeholder="123 456" autocomplete="off"></label>
  <label>Your full name<input id="name" maxlength="30" placeholder="e.g. Nguyễn Minh Anh" autocomplete="off"></label>
  <button class="btn go big" id="joinBtn">Join room</button>
  <p id="joinErr" class="err"></p>
</section>

<section id="sWrite" class="swrite" hidden>
  <div class="sbar">
    <div class="stimer" id="sTimer"><span id="sNum">--:--</span><small id="sLab"></small></div>
    <div class="swords"><b id="sWords">0</b><span id="sMin"></span> words</div>
    <div class="ssync" id="sSync"></div>
  </div>
  <details class="sprompt" id="sPromptBox" open><summary>📄 Task <span id="sRoom"></span></summary><div id="sPrompt"></div></details>
  <div id="sNotice" class="snotice"></div>
  <textarea id="text" placeholder="Type your writing here…" disabled></textarea>
  <div class="sfoot">
    <span id="sName"></span>
    <button class="btn go" id="submit">Submit ✔</button>
    <button class="btn ghost" id="unsubmit" hidden>↩ Keep writing</button>
  </div>
</section>
<div id="net" class="net" hidden></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/v.js"></script>
</body>
</html>
